<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>발행 책상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 잠금 화면 → 풀면 한 줄짜리 작업대: 블로그 탭, 글 카드(복사·사진·체크) */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --sunk:#f5ecea; --fg:#3b2b2f; --muted:#7f6b70; --line:#eadad6;
  --rose:#c45a77; --rose-soft:#f8e3e8; --sage:#4f7f5a; --sage-soft:#e3efe5; --amber:#a86a12; --amber-soft:#f8ecd6;
  --ph:#fff4d6; --ph-line:#e2b54a; --ph-fg:#7a5a07; --danger:#b3261e;
  --display:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --radius:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#1c1618; --surface:#251d20; --sunk:#2d2327; --fg:#f2e7e9; --muted:#b29ca2; --line:#3b2f33;
  --rose:#e8899f; --rose-soft:#3d2530; --sage:#8fc39a; --sage-soft:#22352a; --amber:#e3b25c; --amber-soft:#3a2d17;
  --ph:#3a3015; --ph-line:#a8862e; --ph-fg:#f0d58c; --danger:#f2a49d; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px}
h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.5px;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* 잠금 화면 */
.lock{min-height:80vh;display:grid;place-items:center}
.lockbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:grid;gap:14px}
.lockbox h1{font-size:26px}
.lockbox p{margin:0;color:var(--muted);font-size:13.5px}
.lockbox input[type=password]{font:inherit;font-size:16px;width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);letter-spacing:.04em}
.lockbox label.rem{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13.5px;min-height:1.2em}

header.top{padding-block:14px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab small{font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] small{color:inherit;opacity:.75}
.tab:focus-visible,.btn:focus-visible,.card-head:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

.list{display:grid;gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;
  background:none;border:0;color:inherit;font:inherit;text-align:left}
.card-head .t{font-weight:700;font-size:16px;line-height:1.4;min-width:0}
.card-head .m{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);font-size:13px;transition:transform .15s}
.card.open .chev{transform:rotate(180deg)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.wait{background:var(--sunk);color:var(--muted)}
.pill.saved{background:var(--amber-soft);color:var(--amber)}
.pill.pub{background:var(--sage-soft);color:var(--sage)}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px;background:var(--rose-soft);color:var(--rose)}
.card-body{border-top:1px solid var(--line);padding:4px 16px 18px;display:grid;gap:18px}
.step{display:grid;gap:8px;min-width:0}
.step h3{margin:14px 0 0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-block}
.btn.main{background:var(--rose);color:#fff}
.btn.sub{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ok{background:var(--sage);color:#fff}
.btn.warn{background:var(--amber);color:#fff}
.btn.full{width:100%;padding:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.val{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-all}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photos figure{margin:0;display:grid;gap:5px;min-width:0}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.photos figcaption{font-size:12px;color:var(--muted);line-height:1.35}
.photos figcaption b{color:var(--fg)}
.photos a.dl{font-size:12.5px;font-weight:700;color:var(--rose);text-decoration:none}
.memo{background:var(--rose-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.memo .memo-head{font-weight:700;color:var(--rose);margin-bottom:4px}
.memo .memo-head span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.memo ul{margin:0;padding-left:18px}
details.prev summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted)}
.preview{margin-top:10px;background:var(--sunk);border-radius:12px;padding:14px;font-size:14.5px;max-height:520px;overflow:auto}
.preview h2{font-size:17px;margin:18px 0 8px}
.preview p{margin:0 0 12px}
.preview .ph{background:var(--ph);border:1.5px dashed var(--ph-line);color:var(--ph-fg);font-weight:700;padding:8px 10px;border-radius:8px}
.status{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <section class="lock" id="lock">
    <form class="lockbox" id="lockform" autocomplete="on">
      <h1>발행 책상</h1>
      <p>블로그 원고를 올리기 전에 보는 곳이에요. 비밀번호를 넣어 주세요.</p>
      <input type="text" name="username" value="blog-desk" autocomplete="username" hidden>
      <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
      <label class="rem"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn main full" id="unlockbtn" type="submit">열기</button>
    </form>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div class="toprow">
        <h1>발행 책상</h1>
        <button class="btn sub" id="lockbtn" type="button">잠그기</button>
      </div>
      <p class="lead">글을 열어 제목·본문·태그를 복사하고, 노란 【사진 N】 자리에 같은 번호 사진을 넣은 뒤 네이버에서 저장하세요.</p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <p class="note" id="built"></p>
    </header>
    <main class="list" id="list"></main>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<textarea id="fallback" class="sr" aria-hidden="true"></textarea>

const STATE = { data:null, key:null, tab:null, open:new Set(), checks:{}, blobs:new Map() };
const LABEL = { wait:"대기", saved:"임시저장", pub:"발행 완료" };
const $ = (s, el=document) => el.querySelector(s);
const PWK = "blogdesk.pw", CHK = "blogdesk.checks", TABK = "blogdesk.tab";

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }
function b64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function deriveKey(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function decryptBytes(key, bytes){
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes.slice(0,12)}, key, bytes.slice(12)));
}

async function unlock(pw, remember){
  if(!window.crypto || !crypto.subtle){ throw new Error("nocrypto"); }
  const key = await deriveKey(pw);
  const plain = await decryptBytes(key, b64(ENC.data));
  STATE.data = JSON.parse(new TextDecoder().decode(plain));
  STATE.key = key;
  if(remember) lsSet(PWK, pw); else lsDel(PWK);
  try{ STATE.checks = JSON.parse(lsGet(CHK)||"{}"); }catch(e){ STATE.checks={}; }
  const saved = lsGet(TABK);
  const first = STATE.data.blogs.find(b=>STATE.data.posts.some(p=>p.blog===b.id)) || STATE.data.blogs[0];
  STATE.tab = (saved && STATE.data.blogs.some(b=>b.id===saved)) ? saved : first.id;
  $("#lock").hidden = true; $("#app").hidden = false;
  $("#built").textContent = `원고 업데이트: ${STATE.data.builtAt} · 체크 표시는 이 기기에만 저장돼요`;
  render();
}

  e.preventDefault();
  const btn=$("#unlockbtn"); btn.disabled=true; btn.textContent="여는 중…"; $("#err").textContent="";
  try{ await unlock($("#pw").value.trim(), $("#remember").checked); }
  catch(err){ $("#err").textContent = err && err.message==="nocrypto" ? "이 브라우저에서는 열 수 없어요. 크롬·사파리 최신판으로 열어 주세요." : "비밀번호가 맞지 않아요."; }
  finally{ btn.disabled=false; btn.textContent="열기"; }
});
$("#lockbtn").onclick=()=>{ lsDel(PWK); location.reload(); };

async function copyText(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg||"복사했어요"); }
  catch(e){ const a=$("#fallback"); a.value=text; a.select(); try{ document.execCommand("copy"); toast(msg||"복사했어요"); }catch(_){ toast("복사가 막혔어요. 길게 눌러 복사해 주세요"); } }
}
async function copyRich(html, text){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
      toast("본문을 서식째 복사했어요"); return;
    }
  }catch(e){}
  copyText(text,"서식 복사가 안 돼서 텍스트로 복사했어요");
}

async function imageURL(im){
  if(STATE.blobs.has(im.bin)) return STATE.blobs.get(im.bin);
  const p = (async ()=>{
    const r = await fetch(im.bin, {cache:"force-cache"});
    if(!r.ok) throw new Error("fetch");
    const bytes = await decryptBytes(STATE.key, new Uint8Array(await r.arrayBuffer()));
    return URL.createObjectURL(new Blob([bytes],{type:im.mime}));
  })();
  STATE.blobs.set(im.bin, p);
  return p;
}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function stateOf(p){ return STATE.checks[p.key] || (p.localPublished ? "pub" : "wait"); }
function setCheck(p, st){ if(st==="wait") delete STATE.checks[p.key]; else STATE.checks[p.key]=st; lsSet(CHK, JSON.stringify(STATE.checks)); render(); toast(st==="pub"?"발행 완료로 표시했어요":st==="saved"?"임시저장으로 표시했어요":"대기로 되돌렸어요"); }

function renderTabs(){
  const box=$("#tabs"); box.textContent="";
  for(const b of STATE.data.blogs){
    const list=STATE.data.posts.filter(p=>p.blog===b.id);
    const done=list.filter(p=>stateOf(p)==="pub").length;
    const btn=el("button","tab"); btn.type="button"; btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", String(STATE.tab===b.id));
    btn.append(el("span",null,b.name), el("small",null,`${done}/${list.length} 발행`));
    btn.onclick=()=>{ STATE.tab=b.id; lsSet(TABK,b.id); render(); };
    box.appendChild(btn);
  }
}

function renderCard(p){
  const st=stateOf(p), isOpen=STATE.open.has(p.key);
  const card=el("article","card"+(isOpen?" open":""));
  const head=el("button","card-head"); head.type="button"; head.setAttribute("aria-expanded",String(isOpen));
  const t=el("span","t",p.title); if(p.sponsored) t.appendChild(el("span","badge","체험단"));
  t.appendChild(el("span","m",[p.category,`사진 ${p.images.length}장`,`${p.chars.toLocaleString()}자`,p.baseDate?`기준 ${p.baseDate.slice(0,7)}`:""].filter(Boolean).join(" · ")));
  head.append(el("span","pill "+st,LABEL[st]), t, el("span","chev","▾"));
  head.onclick=()=>{ isOpen?STATE.open.delete(p.key):STATE.open.add(p.key); render(); };
  card.appendChild(head);
  if(!isOpen) return card;
  const body=el("div","card-body");

  const s1=el("section","step"); s1.appendChild(el("h3",null,"① 복사해서 네이버 에디터에 붙여넣기"));
  const r1=el("div","row");
  const mk=(cls,txt,fn)=>{ const b=el("button","btn "+cls,txt); b.type="button"; b.onclick=fn; return b; };
  r1.append(mk("main","제목 복사",()=>copyText(p.title,"제목을 복사했어요")),
            mk("main","본문 복사(서식)",()=>copyRich(p.bodyHtml,p.bodyText)),
            mk("sub","본문 복사(텍스트만)",()=>copyText(p.bodyText,"본문을 텍스트로 복사했어요")),
            mk("sub","태그 복사",()=>copyText(p.tags,"태그를 복사했어요")));
  s1.append(r1, el("div","val",p.title),
    el("p","hint","카테고리: "+(p.category||"미지정")+" · 붙여넣으면 노란 【사진 N】 줄이 생겨요. 그 자리에 같은 번호 사진을 넣고 그 줄은 지우세요."));
  if(p.sponsored) s1.appendChild(el("p","hint","체험단 글: 본문 첫 줄 대가 표시(「"+p.disclosure+"」)는 지우지 마세요."));
  if(p.mapHint) s1.appendChild(el("p","hint","맛집·장소 글은 에디터의 장소(지도) 버튼으로 가게를 꼭 추가하세요."));
  body.appendChild(s1);

  const s2=el("section","step"); s2.appendChild(el("h3",null,`② 사진 ${p.images.length}장 (번호 = 【사진 N】)`));
  s2.appendChild(el("p","hint","사진마다 '저장'을 누르면 파일로 받아져요. 폰은 사진을 꾹 눌러 저장해도 돼요."));
  const grid=el("div","photos");
  for(const im of p.images){
    const f=el("figure"); const img=el("img"); img.alt=im.alt;
    const cap=el("figcaption"); cap.append(el("b",null,`사진 ${im.n} `), document.createTextNode(im.alt));
    const a=el("a","dl","불러오는 중…"); a.download=im.file;
    imageURL(im).then(u=>{ img.src=u; a.href=u; a.textContent=`사진 ${im.n} 저장`; }).catch(()=>{ a.textContent="사진을 못 불러왔어요"; });
    f.append(img,cap,a); grid.appendChild(f);
  }
  s2.appendChild(grid); body.appendChild(s2);

  if(p.memoHtml){ const s3=el("section","step"); s3.appendChild(el("h3",null,"③ 올리기 전에 손볼 곳")); const m=el("div","memo"); m.innerHTML=p.memoHtml; s3.appendChild(m); body.appendChild(s3); }

  const det=el("details","prev"); det.appendChild(el("summary",null,"본문 미리보기"));
  const pv=el("div","preview"); pv.innerHTML=p.bodyHtml; det.appendChild(pv); body.appendChild(det);

  const s4=el("section","step"); s4.appendChild(el("h3",null,"④ 올렸으면 체크 (이 기기에만 저장)"));
  const box=el("div","status"); const r4=el("div","row");
  r4.append(mk("warn","임시저장 했어요",()=>setCheck(p,"saved")), mk("ok","발행 완료",()=>setCheck(p,"pub")), mk("sub","대기로 되돌리기",()=>setCheck(p,"wait")));
  box.append(r4, el("p","hint","발행했으면 네이버 글 주소를 같이 쓰는 사람에게 보내 주세요. 발행 기록은 PC 쪽에서 남겨요."));
  s4.appendChild(box); body.appendChild(s4);

  card.appendChild(body);
  return card;
}

function render(){
  renderTabs();
  const list=$("#list"); list.textContent="";
  const posts=STATE.data.posts.filter(p=>p.blog===STATE.tab);
  if(!posts.length){
    const b=STATE.data.blogs.find(x=>x.id===STATE.tab)||{name:""};
    const e=el("div","empty"); e.append(el("b",null,b.name+"에는 아직 완성된 글이 없어요."), el("p",null,"글이 완성되면 여기에 붙어요."));
    list.appendChild(e); return;
  }
  for(const p of posts) list.appendChild(renderCard(p));
}

(async ()=>{
  const pw=lsGet(PWK);
  if(pw){ try{ await unlock(pw,true); }catch(e){ lsDel(PWK); } }
})();
</script>
</body>
</html>
